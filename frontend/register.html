<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üye Ol - sahibinden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÜST BAR -->
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <span class="logo">sahibinden<span class="logo-dot">.</span></span>
      <span class="topbar-text d-none d-sm-inline">Türkiye'nin İlanları</span>
    </div>
  </header>

  <!-- KAYIT FORMU -->
  <main class="d-flex justify-content-center align-items-center login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Üye Ol</h1>
      <p class="login-subtitle">Hesap oluşturmak için bilgilerini gir</p>

      <div id="formMessage" class="alert d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-posta</label>
          <input type="text" class="form-control" id="email"
            placeholder="ornek@mail.com" autocomplete="email">
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Şifre</label>
          <input type="password" class="form-control" id="password"
            placeholder="En az 6 karakter" autocomplete="new-password">
          <div class="invalid-feedback" id="passwordError"></div>
        </div>

        <div class="mb-3">
          <label for="passwordConfirm" class="form-label">Şifre Tekrar</label>
          <input type="password" class="form-control" id="passwordConfirm"
            placeholder="Şifreni tekrar gir" autocomplete="new-password">
          <div class="invalid-feedback" id="passwordConfirmError"></div>
        </div>

        <button type="submit" class="btn btn-login w-100" id="registerBtn">
          Üye Ol
        </button>
      </form>

      <p class="signup-text">
        Zaten hesabın var mı? <a href="index.html">Giriş Yap</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="register.js"></script>
</body>
</html>
