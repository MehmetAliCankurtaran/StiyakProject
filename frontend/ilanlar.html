<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlanlar - sahibinden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ilanlar.css">
</head>
<body>

  <!-- ÜST BAR -->
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <span class="logo">sahibinden<span class="logo-dot">.</span></span>
      <div class="d-flex align-items-center gap-3">
        <span class="topbar-text d-none d-sm-inline" id="userEmail"></span>
        <button class="btn-logout" id="logoutBtn">Çıkış Yap</button>
      </div>
    </div>
  </header>

  <!-- ARAMA BARI -->
  <div class="search-bar">
    <div class="container">
      <div class="d-flex">
        <input type="text" class="search-input" id="searchInput" placeholder="Ne aramıştınız?">
        <button class="btn-search">Ara</button>
      </div>
    </div>
  </div>

  <!-- KATEGORİ BARI -->
  <div class="category-bar">
    <div class="container">
      <a href="#" class="active-cat">Tümü</a>
      <a href="#">Vasıta</a>
      <a href="#">Emlak</a>
      <a href="#">Elektronik</a>
      <a href="#">Ev & Bahçe</a>
      <a href="#">Giyim</a>
    </div>
  </div>

  <!-- SAYFA BAŞLIĞI -->
  <div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
      <h6 class="mb-0 fw-bold">
        Son İlanlar
        <span class="text-muted fw-normal listing-count"></span>
      </h6>
        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#ilanModal">+ İlan Ver </button>  
      </div>
  </div>

  <!-- İLANLAR -->
  <main class="container py-4">
    <div class="row g-3" id="listingsContainer">
      <!-- İlanlar buraya JS ile eklenecek -->
      <div class="text-center text-muted py-5" id="loadingMsg">Yükleniyor...</div>
    </div>
  </main>


<!-- İLAN EKLEME MODAL -->
<div class="modal fade" id="ilanModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title fw-bold">İlan Ver</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="modalMessage" class="alert d-none" role="alert"></div>

        <form id="ilanForm" novalidate>

          <div class="mb-3">
            <label class="form-label fw-semibold">Başlık</label>
            <input type="text" class="form-control" id="ilanBaslik"
              placeholder="Ör: iPhone 14 Pro 256GB">
            <div class="invalid-feedback" id="baslikError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Kategori</label>
            <select class="form-select" id="ilanKategori">
              <option value="">Seçiniz...</option>
              <option>Vasıta</option>
              <option>Emlak</option>
              <option>Elektronik</option>
              <option>Ev & Bahçe</option>
              <option>Giyim</option>
              <option>Diğer</option>
            </select>
            <div class="invalid-feedback" id="kategoriError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Fiyat (TL)</label>
            <input type="number" class="form-control" id="ilanFiyat"
              placeholder="Ör: 15000" min="0">
            <div class="invalid-feedback" id="fiyatError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Konum</label>
            <input type="text" class="form-control" id="ilanKonum"
              placeholder="Ör: İstanbul / Kadıköy">
            <div class="invalid-feedback" id="konumError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Açıklama <span class="text-muted fw-normal">(isteğe bağlı)</span></label>
            <textarea class="form-control" id="ilanAciklama"
              rows="3" placeholder="İlan hakkında detay ver..."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Fotoğraflar <span class="text-muted fw-normal">(en fazla 5)</span></label>
            <input type="file" class="form-control" id="ilanResimler"
              accept="image/*" multiple>
            <div class="form-text">jpg, png veya webp — her biri otomatik uygun boyuta küçültülür.</div>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn-add" id="ilanGonderBtn">İlanı Yayınla</button>
      </div>

    </div>
  </div>
</div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ilanlar.js"></script>
</body>
</html>
