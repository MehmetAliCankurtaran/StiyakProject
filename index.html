<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Kendi stil dosyamız (Bootstrap'ten SONRA çağrılır, üzerine yazsın diye) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÜST BAR -->
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <span class="logo">sahibinden<span class="logo-dot">.</span></span>
      <span class="topbar-text d-none d-sm-inline">Türkiye'nin İlanları</span>
    </div>
  </header>

  <!-- GİRİŞ FORMU -->
  <main class="d-flex justify-content-center align-items-center login-wrapper">
    <div class="login-card">

      <h1 class="login-title">Giriş Yap</h1>
      <p class="login-subtitle">Hesabınıza erişmek için bilgilerinizi girin</p>

      <!-- Hata/Uyarı mesajı buraya JS ile basılacak -->
      <div id="formMessage" class="alert d-none" role="alert"></div>

      <form id="loginForm" novalidate>

        <!-- E-POSTA -->
        <div class="mb-3">
          <label for="email" class="form-label">E-posta</label>
          <input
            type="text"
            class="form-control"
            id="email"
            placeholder="ornek@mail.com"
            autocomplete="username"
          >
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <!-- ŞİFRE -->
        <div class="mb-2">
          <label for="password" class="form-label">Şifre</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <div class="invalid-feedback" id="passwordError"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small" for="rememberMe">Beni hatırla</label>
          </div>
          <a href="#" class="small forgot-link">Şifremi unuttum</a>
        </div>

        <button type="submit" class="btn btn-login w-100" id="loginBtn">
          Giriş Yap
        </button>

      </form>

      <p class="signup-text">
        Hesabın yok mu? <a href="#">Üye ol</a>
      </p>

    </div>
  </main>

  <!-- Bootstrap JS (dropdown, vs. ileride lazım olursa) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Kendi JS dosyamız - HER ZAMAN EN SONDA çağrılır (DOM önce yüklensin diye) -->
  <script src="script.js"></script>
</body>
</html>
